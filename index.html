<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasía Artesana — Catálogo Mágico</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #0d1a1a;
    color: #f0ece4;
    min-height: 100vh;
  }

  /* DESTELLOS */
  .fairy-dust { position: fixed; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:0; overflow:hidden; }
  .sparkle { position:absolute; border-radius:50%; animation: blink var(--d,3s) ease-in-out infinite; opacity:0; }
  @keyframes blink { 0%,100%{opacity:0;transform:scale(.5) rotate(0deg)} 50%{opacity:var(--o,.9);transform:scale(1.4) rotate(180deg)} }

  .page { position: relative; z-index: 1; padding-bottom: 3rem; }

  /* HEADER */
  .header {
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    background: linear-gradient(180deg, #0a1f1f 0%, transparent 100%);
  }
  .logo-img {
    width: 110px; height: 110px;
    border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(78,205,196,.5);
    box-shadow: 0 0 20px rgba(78,205,196,.3), 0 0 40px rgba(138,79,255,.2);
    margin-bottom: 10px;
  }
  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
    background: linear-gradient(135deg, #8a4fff, #4ecdc4, #c9a84c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header p { font-size: clamp(.78rem, 2vw, .95rem); color: #9bcfcb; font-style: italic; letter-spacing: 1px; }
  .slogan { font-size: clamp(.68rem, 1.8vw, .82rem); color: #c9a84c; letter-spacing: 1px; margin-top: 3px; opacity: .85; }
  .divider { display:flex; align-items:center; gap:8px; justify-content:center; margin: 12px 0 0; }
  .divider-line { height:1px; width:50px; }
  .divider-line.l { background: linear-gradient(to right, transparent, #8a4fff); }
  .divider-line.r { background: linear-gradient(to left, transparent, #4ecdc4); }

  /* FILTROS */
  .nav-filters { display:flex; gap:.5rem; padding: 1rem 1rem 0; overflow-x:auto; scrollbar-width:none; margin-bottom:1.5rem; }
  .nav-filters::-webkit-scrollbar { display:none; }
  .filter-btn {
    background: #0d2222; border: 1px solid rgba(78,205,196,.25);
    color: #9bcfcb; padding: .45rem 1rem; border-radius: 20px;
    font-size: clamp(.75rem, 2vw, .88rem); font-weight: 700; cursor: pointer;
    transition: all .25s; white-space: nowrap; font-family: 'Nunito', sans-serif;
  }
  .filter-btn.active {
    background: linear-gradient(135deg, #4ecdc4, #8a4fff);
    border-color: transparent; color: #fff;
    box-shadow: 0 3px 14px rgba(78,205,196,.35);
  }

  /* LAYOUT PRINCIPAL */
  .catalog-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  /* GRID RESPONSIVO */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.2rem;
    margin-bottom: 1.5rem;
  }

  /* CARD DESTACADA (full width) */
  .featured-card {
    grid-column: 1 / -1;
    background: linear-gradient(145deg, #0f2626, #1a0d30);
    border: 1.5px solid rgba(78,205,196,.45);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(78,205,196,.12);
    display: flex;
    flex-direction: row;
  }
  .featured-card::before {
    content:''; display:block; width: 3px;
    background: linear-gradient(180deg, #8a4fff, #4ecdc4, #c9a84c);
    flex-shrink: 0;
  }
  @media (max-width: 600px) {
    .featured-card { flex-direction: column; }
    .featured-card::before { width: 100%; height: 3px; background: linear-gradient(90deg, #8a4fff, #4ecdc4, #c9a84c); }
  }

  .featured-carousel { width: 340px; min-width: 340px; position: relative; }
  @media (max-width: 600px) { .featured-carousel { width: 100%; min-width: unset; } }
  .featured-info { padding: 1.4rem; flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* PRODUCT CARD */
  .product-card {
    background: #0f2020;
    border: 1px solid rgba(78,205,196,.18);
    border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 4px 15px rgba(0,0,0,.5);
    transition: transform .2s, box-shadow .2s;
  }
  .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(78,205,196,.22); }

  /* CARRUSEL */
  .carousel { position: relative; overflow: hidden; background: #0a1515; }
  .carousel-track { display: flex; transition: transform .35s ease; }
  .carousel-track img {
    width: 100%; flex-shrink: 0;
    object-fit: cover;
    display: block;
  }
  .featured-carousel .carousel-track img { height: 320px; }
  @media (max-width: 600px) { .featured-carousel .carousel-track img { height: 240px; } }
  .product-card .carousel-track img { height: 200px; }
  @media (min-width: 900px) { .product-card .carousel-track img { height: 220px; } }

  .carousel-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(13,26,26,.7); border: 1px solid rgba(78,205,196,.4);
    color: #4ecdc4; width: 32px; height: 32px; border-radius: 50%;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .2s; z-index: 2;
  }
  .carousel-btn:hover { background: #4ecdc4; color: #0d1a1a; }
  .carousel-btn.prev { left: 8px; }
  .carousel-btn.next { right: 8px; }
  .carousel-dots { display: flex; justify-content: center; gap: 5px; padding: 6px 0 4px; background: #0a1515; }
  .cdot { width: 6px; height: 6px; border-radius: 50%; background: #2a4040; cursor: pointer; transition: background .2s; }
  .cdot.on { background: #4ecdc4; }

  /* INFO CARD */
  .card-body { padding: .9rem; flex-grow: 1; display: flex; flex-direction: column; }
  .p-tag { font-size: .68rem; font-weight: 700; text-transform: uppercase; color: #4ecdc4; letter-spacing: 1px; margin-bottom: .2rem; }
  .p-title { font-size: clamp(.88rem, 2vw, 1rem); font-weight: 700; color: #f0ece4; margin-bottom: .3rem; line-height: 1.3; }
  .p-desc { font-size: clamp(.72rem, 1.8vw, .8rem); color: #9bcfcb; margin-bottom: .8rem; line-height: 1.4; flex-grow: 1; }
  .p-footer { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
  .p-footer-left { display: flex; gap: 6px; align-items: center; }
  .p-price { font-size: clamp(.9rem, 2vw, 1.05rem); font-weight: 700; color: #c9a84c; text-align: right; flex-shrink: 0; }
  .btn-buy {
    background: rgba(78,205,196,.1); border: 1px solid #4ecdc4;
    color: #4ecdc4; padding: .4rem .9rem; border-radius: 8px;
    font-size: clamp(.72rem, 1.8vw, .8rem); font-weight: 700;
